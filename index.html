<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<meta property="og:title" content="How much do machine stoppages cost your factory?">
<meta property="og:description" content="A free calculator from Da'im. Answer a few questions and see the cost of stoppages in pounds, every month and every year. English and Arabic.">
<meta property="og:type" content="website">

<style>
:root {
  --ink: #0c2125;
  --ink-soft: #16343a;
  --ink-line: #2a4a50;
  --teal: #0e5a64;
  --brass: #a8833c;
  --brass-bright: #d9b46a;
  --paper: #f5f6f6;
  --card: #ffffff;
  --line: #e1e5e5;
  --line-strong: #c9d1d1;
  --text: #0d1f22;
  --muted: #5c6b6e;
  --down: #c8372c;
  --down-bright: #ff7c69;
  --down-soft: #fbe9e7;
  --risk-soft: #fbefdd;
  --risk-ink: #7a4508;
  --go: #17764d;
  --on-ink: #eef3f3;
  --on-ink-muted: #a3b8bb;
  --font: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
}
html[lang="en"] { --font: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #3fb5c2; outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Top band ---------- */
.band { background: var(--ink); color: var(--on-ink); }
.top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand-name { font-size: 17px; font-weight: 600; display: flex; gap: 7px; align-items: baseline; line-height: 1; }
.brand-name span:last-child { color: var(--brass-bright); }
.lang-btn {
  background: transparent; color: var(--on-ink); border: 1px solid var(--ink-line);
  border-radius: 6px; padding: 7px 14px; font-size: 14px; font-weight: 500; min-height: 40px;
}
.lang-btn:hover { background: var(--ink-soft); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.demo-btn {
  display: inline-flex; align-items: center; gap: 7px; background: var(--brass); color: #1c1503; border: 0;
  border-radius: 6px; padding: 7px 14px; font-size: 14px; font-weight: 600; min-height: 40px;
}
.demo-btn:hover { background: var(--brass-bright); }
html[dir="rtl"] .demo-btn svg { transform: scaleX(-1); }
.hero-log {
  margin-top: 20px; display: inline-flex; align-items: center; gap: 12px; text-align: start;
  background: var(--ink-soft); color: #fff; border: 1px solid var(--ink-line); border-radius: 10px;
  padding: 12px 16px; max-width: 100%;
}
.hero-log:hover { border-color: var(--brass-bright); }
.hero-log svg { flex: none; color: var(--brass-bright); }
.hero-log b { display: block; font-weight: 600; font-size: 16px; line-height: 1.35; }
.hero-log span { display: block; font-size: 14px; color: var(--on-ink-muted); line-height: 1.4; }

.hero { padding-block: 28px 40px; max-width: 720px; }
.hero .free { color: var(--brass-bright); font-weight: 500; font-size: 15px; margin-bottom: 10px; }
.hero h1 { font-size: clamp(30px, 6.2vw, 50px); line-height: 1.22; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
html[lang="ar"] .hero h1 { letter-spacing: 0; line-height: 1.4; }
.hero .lead { margin-top: 14px; color: var(--on-ink-muted); font-size: 17px; max-width: 56ch; }

/* ---------- Layout ---------- */
.grid { display: grid; gap: 20px; padding-block: 20px 120px; }
@media (min-width: 980px) {
  .grid { grid-template-columns: minmax(0, 1fr) 440px; gap: 28px; align-items: start; padding-block: 28px 64px; }
  .result-col { position: sticky; top: 16px; }
}

.example-note {
  background: var(--risk-soft); color: var(--risk-ink); border-radius: 8px;
  padding: 10px 14px; font-size: 15px; font-weight: 500; margin-bottom: 16px;
}

/* ---------- Steps ---------- */
.step { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 18px 6px; margin-bottom: 16px; }
@media (min-width: 640px) { .step { padding: 24px 24px 8px; } }
.step-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.step-n {
  flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: 15px;
}
.step h2 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.step-sub { color: var(--muted); font-size: 14px; margin-inline-start: auto; }

.field { padding-bottom: 20px; }
.field label, .field .label { display: block; font-weight: 500; font-size: 16px; line-height: 1.45; }
.help { color: var(--muted); font-size: 14px; margin-top: 2px; }
.control { margin-top: 10px; }
.pair { display: grid; gap: 0 20px; }
@media (min-width: 640px) { .pair { grid-template-columns: 1fr 1fr; } }

.stepper { display: inline-flex; direction: ltr; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: #fff; }
.stepper button { width: 48px; height: 48px; border: 0; background: #f0f3f3; font-size: 22px; line-height: 1; color: var(--ink); }
.stepper button:hover { background: #e4e9e9; }
.stepper button:active { background: #d7dede; }
.stepper input { width: 84px; height: 48px; border: 0; border-inline: 1px solid var(--line-strong); text-align: center; font-size: 18px; font-weight: 600; background: #fff; border-radius: 0; }
.stepper:focus-within { border-color: var(--teal); }

.money { display: flex; align-items: center; direction: ltr; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; max-width: 280px; overflow: hidden; }
.money span { padding-inline: 12px; color: var(--muted); font-size: 14px; background: #f0f3f3; align-self: stretch; display: grid; place-items: center; border-inline-end: 1px solid var(--line-strong); }
.money input { flex: 1; min-width: 0; height: 48px; border: 0; padding-inline: 12px; font-size: 18px; font-weight: 600; background: transparent; }
.money:focus-within { border-color: var(--teal); }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  min-height: 46px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: #fff; font-weight: 500; font-size: 15px; flex: 1 1 auto;
}
.seg button:hover { border-color: var(--teal); }
.seg button[aria-checked="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.seg.choice { gap: 10px; }
.seg.choice button { flex: 1 1 230px; text-align: start; padding: 14px 16px; border-width: 2px; }
.seg.choice b { display: block; font-size: 17px; font-weight: 600; line-height: 1.35; }
.seg.choice span { display: block; font-size: 14px; font-weight: 400; color: var(--muted); line-height: 1.45; margin-top: 2px; }
.seg.choice button[aria-checked="true"] span { color: #cfe6e8; }

.range-row { display: flex; align-items: center; gap: 14px; }
.range-row output { flex: none; min-width: 92px; font-weight: 600; font-size: 17px; }
input[type="range"] { flex: 1; min-width: 0; height: 32px; accent-color: var(--teal); }

.inline-fact { color: var(--teal); font-weight: 500; font-size: 15px; padding-bottom: 18px; }
.warn { background: var(--down-soft); color: #8c2219; border-radius: 8px; padding: 10px 14px; font-size: 15px; margin-bottom: 18px; }

/* ---------- Stoppage log ---------- */
.log-box { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 20px; background: #fafbfb; }
.log-box > p { font-size: 15px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 16px; text-decoration: none; text-align: center; }
.btn-stop { background: var(--down); color: #fff; width: 100%; margin-top: 12px; }
.btn-stop:hover { background: #b12f25; }
.btn-run { background: var(--go); color: #fff; width: 100%; margin-top: 12px; }
.btn-quiet { background: #fff; border-color: var(--line-strong); color: var(--ink); }
.btn-quiet:hover { border-color: var(--teal); }
.timer { margin-top: 12px; background: var(--down-soft); border-radius: 8px; padding: 14px; text-align: center; }
.timer .clock { font-size: 34px; font-weight: 700; color: var(--down); direction: ltr; line-height: 1.2; }
.timer .since { font-size: 14px; color: #8c2219; }
.log-add { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.log-add h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.log-add-row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.log-add-row .full { grid-column: 1 / -1; }
.log-add label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 500; }
.log-add input { width: 100%; height: 46px; border: 1px solid var(--line-strong); border-radius: 8px; padding-inline: 12px; background: #fff; font-size: 16px; }
.log-add input:focus { border-color: var(--teal); }
.log-err { color: #8c2219; font-size: 14px; margin-top: 8px; }
.log-list { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); max-height: 260px; overflow: auto; }
.log-list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log-list .when { color: var(--muted); flex: none; min-width: 62px; }
.log-list .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-list .dur { font-weight: 600; flex: none; }
.log-list button { flex: none; width: 36px; height: 36px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
.log-list button:hover { background: var(--down-soft); color: var(--down); }
.log-sum { margin-top: 14px; font-size: 15px; }
.log-sum strong { font-weight: 600; }
.log-foot { margin-top: 10px; }
.link-btn { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; font-size: 14px; }
.link-btn:hover { color: var(--down); }

/* ---------- Result ---------- */
.result { background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 22px 18px; }
@media (min-width: 640px) { .result { padding: 26px 24px; } }
.tag { display: inline-block; background: var(--brass); color: #1c1503; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 4px; margin-bottom: 10px; }
.result .kicker { color: var(--on-ink-muted); font-size: 16px; }
.total { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; line-height: 1.1; }
.total .fig { font-size: clamp(40px, 11vw, 56px); font-weight: 700; color: var(--down-bright); letter-spacing: -0.02em; direction: ltr; }
.total .unit { font-size: 18px; font-weight: 500; color: var(--on-ink); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; border-top: 1px solid var(--ink-line); border-bottom: 1px solid var(--ink-line); }
.stats > div { padding: 12px 10px; border-inline-end: 1px solid var(--ink-line); }
.stats > div:first-child { padding-inline-start: 0; }
.stats > div:last-child { border-inline-end: 0; padding-inline-end: 0; }
.stats b { display: block; font-size: 18px; font-weight: 600; color: #fff; line-height: 1.3; }
.stats span { display: block; font-size: 13px; color: var(--on-ink-muted); line-height: 1.4; margin-top: 2px; }

.block { margin-top: 22px; }
.block h3 { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 10px; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(24px, 1fr)); gap: 5px; max-width: 100%; }
.cell { position: relative; aspect-ratio: 1; border-radius: 4px; background: #24474d; overflow: hidden; }
.cell i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--down-bright); transition: inline-size .35s ease; }
.board-cap { margin-top: 10px; font-size: 15px; color: var(--on-ink-muted); }
.board-cap b { color: #fff; font-weight: 600; }

.rows { list-style: none; margin: 0; padding: 0; }
.rows li { margin-bottom: 12px; }
.rows .line { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.rows .line span:first-child { color: var(--on-ink); }
.rows .line span:last-child { font-weight: 600; color: #fff; flex: none; }
.track { height: 8px; background: #1d3d43; border-radius: 4px; margin-top: 5px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--down-bright); border-radius: 4px; transition: width .35s ease; }

.notes { list-style: none; margin: 0; padding: 0; font-size: 15px; color: var(--on-ink-muted); }
.notes li { padding: 8px 0; border-top: 1px solid var(--ink-line); }
.notes li:first-child { border-top: 0; padding-top: 0; }
.notes b { color: #fff; font-weight: 600; }

.whatif { background: var(--ink-soft); border-radius: 10px; padding: 16px; }
.whatif .q { font-size: 16px; color: var(--on-ink); }
.whatif .q b { color: #fff; }
.whatif input[type="range"] { width: 100%; accent-color: var(--brass-bright); margin-top: 6px; }
.whatif .save { margin-top: 6px; font-size: 16px; color: var(--on-ink); }
.whatif .save b { display: block; font-size: 28px; font-weight: 700; color: #7fdcae; line-height: 1.3; }
.whatif .how { margin-top: 8px; font-size: 14px; color: var(--on-ink-muted); }

.actions { display: grid; gap: 10px; margin-top: 22px; }
.btn-wa { background: #1f9d63; color: #fff; }
.btn-wa:hover { background: #1a8754; }
.btn-ghost { background: transparent; border-color: var(--ink-line); color: var(--on-ink); font-weight: 500; }
.btn-ghost:hover { background: var(--ink-soft); }
.actions-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fine { margin-top: 14px; font-size: 13px; color: var(--on-ink-muted); }

/* ---------- Method, footer ---------- */
.method { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
.method summary { padding: 16px 18px; font-weight: 600; cursor: pointer; font-size: 16px; }
.method ol { margin: 0; padding: 0 18px 16px; padding-inline-start: 38px; color: #2c3f43; font-size: 15px; }
.method li { margin-bottom: 8px; }
.form-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.form-foot .link-btn:hover { color: var(--teal); }
footer { border-top: 1px solid var(--line); padding-block: 22px 110px; color: var(--muted); font-size: 14px; }
@media (min-width: 980px) { footer { padding-bottom: 28px; } }
footer b { color: var(--text); font-weight: 600; }

/* ---------- Phone bar ---------- */
.bar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: var(--ink); color: #fff;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--ink-line); transition: transform .25s ease;
}
.bar.off { transform: translateY(110%); }
.bar .bar-l span { display: block; font-size: 12px; color: var(--on-ink-muted); line-height: 1.3; }
.bar .bar-l b { font-size: 20px; font-weight: 700; color: var(--down-bright); line-height: 1.3; }
.bar a { flex: none; background: #fff; color: var(--ink); border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 15px; text-decoration: none; }
@media (min-width: 980px) { .bar { display: none; } }

.toast {
  position: fixed; inset-inline: 16px; bottom: 84px; z-index: 30; margin-inline: auto; max-width: 360px;
  background: #fff; color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 12px 16px; text-align: center; font-weight: 500; box-shadow: 0 8px 28px rgba(12, 33, 37, .22);
}

.print-only { display: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}

@media print {
  body { background: #fff; font-size: 12pt; }
  .band { background: #fff; color: #000; border-bottom: 2px solid #000; }
  .brand { color: #000; }
  .brand-name span:last-child { color: #000; }
  .lang-btn, .demo-btn, .hero-log, #tour, .tour-hint, .hero .lead, .form-col, .bar, .actions, .whatif input, .toast, .tag { display: none !important; }
  .hero { padding-block: 6px 12px; }
  .hero h1 { color: #000; font-size: 20pt; }
  .hero .free { color: #000; }
  .grid { display: block; padding: 12px 0; }
  .result-col { position: static; }
  .result { background: #fff; color: #000; padding: 0; border-radius: 0; }
  .result .kicker, .stats span, .board-cap, .notes, .fine, .whatif .how, .whatif .q, .whatif .save, .rows .line span:first-child, .total .unit { color: #222; }
  .total .fig { color: #b3261b; }
  .stats b, .block h3, .rows .line span:last-child, .board-cap b, .notes b, .whatif .q b { color: #000; }
  .stats, .stats > div, .notes li { border-color: #bbb; }
  .cell { background: #e3e7e7; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cell i, .track i { background: #c8372c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .track { background: #e3e7e7; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .whatif { background: #fff; border: 1px solid #bbb; }
  .whatif .save b { color: #17764d; }
  .board { max-width: 420px; }
  .print-only { display: block; margin-top: 18px; }
  .print-only h3 { font-size: 12pt; margin-bottom: 6px; }
  .print-only table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
  .print-only td { border-bottom: 1px solid #ccc; padding: 4px 0; }
  .print-only td:last-child { text-align: end; font-weight: 600; }
  footer { padding: 10px 0; }
  .block, .print-only { break-inside: avoid; }
}
</style>

<body>

<div class="band">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#a8833c"/><path d="M20 20c-2.6-3.6-4.9-5.4-7.6-5.4a5.4 5.4 0 1 0 0 10.8c2.7 0 5-1.8 7.6-5.4Zm0 0c2.6 3.6 4.9 5.4 7.6 5.4a5.4 5.4 0 1 0 0-10.8c-2.7 0-5 1.8-7.6 5.4Z" fill="none" stroke="#0c2125" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="brand-name"><span lang="en">Da&rsquo;im</span><span lang="ar">دائم</span></div>
      </div>
      <div class="top-actions">
        <button class="demo-btn" id="demoBtn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.5v15l12.500-7.500z" fill="currentColor"/></svg><span data-i18n="runDemo"></span></button>
        <button class="lang-btn" id="langBtn" type="button"></button>
      </div>
    </div>
    <div class="hero">
      <p class="free" data-i18n="free"></p>
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
      <button class="hero-log" id="heroLog" type="button">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9.500v4.200l2.800 1.700M9.500 2.500h5M12 2.500V6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><b data-i18n="heroLogT"></b><span data-i18n="heroLogD"></span></span>
      </button>
    </div>
  </div>
</div>

<div class="wrap">
  <main class="grid">

/* ---------- storage ---------- */
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveStore() {
  if (window.__tourActive) return;   // the guided demo never overwrites the visitor's own numbers
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ lang: lang, state: state, log: log })); } catch (e) {}
}

var stored = loadStore();
var state = Object.assign({}, DEFAULTS, stored.state || {});
var log = Object.assign({ start: null, entries: [], running: null }, stored.log || {});
if (!Array.isArray(log.entries)) log.entries = [];
var lang = (function () {
  var q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ar") return q;
  return stored.lang === "ar" ? "ar" : "en";
})();

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function t(key, vars) {
  var s = T[lang][key];
  if (s == null) s = T.en[key];
  if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
var nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
var nf1 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });
function n0(v) { return nf0.format(Math.round(v)); }
function n1(v) { return nf1.format(Math.round(v * 10) / 10); }
function money(v) { return lang === "ar" ? n0(v) + " جنيه" : "EGP " + n0(v); }
function parseNum(str) {
  str = String(str)
    .replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
    .replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); })
    .replace(/[٬,\s]/g, "").replace("٫", ".");
  if (str === "") return NaN;
  var n = Number(str);
  return isFinite(n) ? n : NaN;
}
function word(key, n) { var w = T[lang][key]; return Number(n) === 1 ? w[0] : w[1]; }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayNumber(str) {
  var p = str.split("-");
  return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
}
function fieldMax(key) {
  if (key === "hours") return Math.floor(24 / state.shifts);
  if (key === "smallMin") return state.hours * 60;
  return FIELDS[key].max;
}

/* ---------- the calculation ---------- */
function logStats(lg, today) {
  var entries = lg.entries || [];
  if (!entries.length) return { count: 0, days: 0, totalH: 0, bigH: 0, smallH: 0, bigCount: 0, factor: 0 };
  var start = lg.start || today;
  entries.forEach(function (e) { if (e.date < start) start = e.date; });
  var days = Math.max(1, dayNumber(today) - dayNumber(start) + 1);
  var bigMin = 0, smallMin = 0, bigCount = 0;
  entries.forEach(function (e) {
    if (e.min >= BREAKDOWN_MIN) { bigMin += e.min; bigCount++; } else { smallMin += e.min; }
  });
  return {
    count: entries.length, days: days, totalH: (bigMin + smallMin) / 60,
    bigH: bigMin / 60, smallH: smallMin / 60, bigCount: bigCount, factor: MONTH_DAYS / days
  };
}

function compute(s, lg, today) {
  var shiftsMonth = s.days * s.shifts * 52 / 12;
  var monthHours = shiftsMonth * s.hours;
  var hoursPerDay = s.shifts * s.hours;
  var workDays = s.days * 52 / 12;
  var ls = logStats(lg, today);
  var useLog = s.mode === "log" && ls.count > 0 && ls.days >= LOG_MIN_DAYS;

  var bigH, smallH, breakdowns;
  if (useLog) {
    bigH = ls.bigH * ls.factor; smallH = ls.smallH * ls.factor; breakdowns = ls.bigCount * ls.factor;
  } else {
    bigH = s.breakdowns * s.avgHours; smallH = s.smallMin / 60 * shiftsMonth; breakdowns = s.breakdowns;
  }
  var raw = bigH + smallH;
  var over = raw > monthHours + 1e-9;
  if (over) { var k = monthHours / raw; bigH *= k; smallH *= k; }
  var downH = bigH + smallH;
  var effH = downH * s.share;

  var salesPerHour = monthHours > 0 ? s.sales / monthHours : 0;
  var marginPerHour = salesPerHour * (1 - s.material / 100);
  var workerHours = s.days * s.hours * 52 / 12;
  var hourlyWage = workerHours > 0 ? s.wage / workerHours : 0;

  var margin = Math.round(effH * (1 - s.recover) * marginPerHour);
  var overtime = Math.round(effH * s.recover * s.workers * hourlyWage * OVERTIME_RATE);
  var repairs = Math.round(breakdowns * s.repair);
  var scrap = Math.round(breakdowns * s.scrap);
  var penalty = Math.round(s.penalty);
  var month = margin + overtime + repairs + scrap + penalty;

  return {
    monthHours: monthHours, workDays: workDays, hoursPerDay: hoursPerDay,
    useLog: useLog, log: ls, over: over,
    downH: downH, smallH: smallH, bigH: bigH, effH: effH, breakdowns: breakdowns,
    stoppedPct: monthHours > 0 ? downH / monthHours * 100 : 0,
    smallPct: downH > 0 ? smallH / downH * 100 : 0,
    lostDays: hoursPerDay > 0 ? effH / hoursPerDay : 0,
    parts: { margin: margin, overtime: overtime, repairs: repairs, scrap: scrap, penalty: penalty },
    month: month, year: month * 12,
    perHour: downH > 0 ? month / downH : 0,
    pctSales: s.sales > 0 ? month / s.sales * 100 : 0,
    idleWages: Math.round(effH * s.workers * hourlyWage)
  };
}
window.__calc = { compute: compute, logStats: logStats, DEFAULTS: DEFAULTS };

/* ---------- build the form ---------- */
function buildFields() {
  document.querySelectorAll("[data-field]").forEach(function (box) {
    var key = box.getAttribute("data-field"), f = FIELDS[key], id = "f-" + key, html = "";
    var help = f.help ? '<p class="help" data-i18n="' + key + 'Help"></p>' : "";
    if (f.type === "seg") {
      html = '<span class="label" id="' + id + '-l" data-i18n="' + key + '"></span>' + help +
        '<div class="control seg" role="radiogroup" aria-labelledby="' + id + '-l" data-seg="' + key + '">' +
        f.opts.map(function (o) {
          return '<button type="button" role="radio" data-val="' + o[0] + '"' +
            (f.i18nOpts ? ' data-i18n="' + o[1] + '">' : ' class="num">' + o[1]) + "</button>";
        }).join("") + "</div>";
    } else if (f.type === "stepper") {
      html = '<label for="' + id + '" data-i18n="' + key + '"></label>' + help +
        '<div class="control"><div class="stepper">' +
        '<button type="button" data-dir="-1" data-for="' + key + '" data-i18n-aria="dec">&minus;</button>' +
        '<input id="' + id + '" class="num" type="text" inputmode="decimal" autocomplete="off" data-key="' + key + '">' +
        '<button type="button" data-dir="1" data-for="' + key + '" data-i18n-aria="inc">+</button>' +
        "</div></div>";
    } else if (f.type === "money") {
      html = '<label for="' + id + '" data-i18n="' + key + '"></label>' + help +
        '<div class="control"><div class="money"><span data-i18n="egp"></span>' +
        '<input id="' + id + '" class="num" type="text" inputmode="numeric" autocomplete="off" data-key="' + key + '"></div></div>';
    } else if (f.type === "range") {
      html = '<label for="' + id + '" data-i18n="' + key + '"></label>' + help +
        '<div class="control range-row"><input id="' + id + '" type="range" min="' + f.min + '" max="' + f.max +
        '" step="' + f.inc + '" data-key="' + key + '"><output class="num" id="' + id + '-o" for="' + id + '"></output></div>';
    }
    box.innerHTML = html;
  });
}

function setValue(key, v) {
  var f = FIELDS[key];
  if (f && f.type !== "seg") {
    v = clamp(v, f.min, fieldMax(key));
    v = Math.round(v * 100) / 100;
  }
  state[key] = v;
  if (key === "shifts") state.hours = Math.min(state.hours, fieldMax("hours"));
  if (key === "shifts" || key === "hours") state.smallMin = Math.min(state.smallMin, fieldMax("smallMin"));
  if (key !== "mode") state.touched = true;
  saveStore();
  render();
}

function syncInputs() {
  document.querySelectorAll("input[data-key]").forEach(function (el) {
    var key = el.getAttribute("data-key"), f = FIELDS[key];
    if (f.type === "range") { el.value = state[key]; return; }
    if (document.activeElement === el) return;
    el.value = f.type === "money" ? n0(state[key]) : String(state[key]);
  });
  document.querySelectorAll("[data-seg]").forEach(function (g) {
    var key = g.getAttribute("data-seg");
    g.querySelectorAll("button").forEach(function (b) {
      var on = String(state[key]) === b.getAttribute("data-val");
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    });
  });
}

/* ---------- render ---------- */
var shownYear = 0, animId = 0;
function animateFig(to) {
  var el = $("figYear"), from = shownYear;
  cancelAnimationFrame(animId);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || from === to) { shownYear = to; el.textContent = n0(to); return; }
  var t0 = performance.now(), dur = 450;
  (function tick(now) {
    var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    shownYear = from + (to - from) * e;
    el.textContent = n0(shownYear);
    if (p < 1) animId = requestAnimationFrame(tick); else { shownYear = to; el.textContent = n0(to); }
  })(t0);
}

function fmtDur(min) {

function render() {

});

document.addEventListener("keydown", function (ev) {
  var b = ev.target.closest && ev.target.closest("[data-seg] button");
  if (!b) return;
  var keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (!(ev.key in keys)) return;
  ev.preventDefault();
  var step = keys[ev.key];
  if ((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && document.documentElement.dir === "rtl") step = -step;
  var all = Array.prototype.slice.call(b.parentNode.children);
  var next = all[(all.indexOf(b) + step + all.length) % all.length];
  next.click(); next.focus();
});

document.addEventListener("input", function (ev) {
  var el = ev.target, key = el.getAttribute && el.getAttribute("data-key");
  if (!key) return;
  var v = parseNum(el.value);
  if (isNaN(v)) return;
  setValue(key, v);
});
document.addEventListener("focusout", function (ev) {
  var el = ev.target;
  if (el.getAttribute && el.getAttribute("data-key")) syncInputs();
});
document.addEventListener("focusin", function (ev) {
  var el = ev.target;
  if (el.getAttribute && el.getAttribute("data-key") && el.type === "text") el.select();
});

$("wiRange").addEventListener("input", function () { state.whatif = +this.value; saveStore(); render(); });

$("langBtn").addEventListener("click", function () {
  lang = lang === "ar" ? "en" : "ar";
  saveStore(); applyI18n(); render();
});

$("heroLog").addEventListener("click", function () {
  setValue("mode", "log");
  $("step2").scrollIntoView({ block: "start" });
});

$("resetBtn").addEventListener("click", function () {
  if (!confirm(t("resetAsk"))) return;
  state = Object.assign({}, DEFAULTS); saveStore(); render();
});

$("printBtn").addEventListener("click", function () { window.print(); });

$("shareBtn").addEventListener("click", function () {
  var url = location.href.split("#")[0].split("?")[0];
  if (navigator.share) { navigator.share({ title: t("h1"), text: t("shareText"), url: url }).catch(function () {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function () { toast(t("toastCopied")); }, function () { prompt("", url); });
  } else { prompt("", url); }
});

/* ---------- stoppage log ---------- */
var nextId = log.entries.reduce(function (m, e) { return Math.max(m, e.id); }, 0) + 1;
function addEntry(date, min, note) {
  log.entries.push({ id: nextId++, date: date, min: min, note: note });
  if (!log.start || date < log.start) log.start = date;
  state.touched = true;
  saveStore(); render();
}
function tickClock() {
  if (!log.running) return;
  var s = Math.max(0, Math.floor((Date.now() - log.running.t0) / 1000));
  var p = function (n) { return String(n).padStart(2, "0"); };
  $("logClock").textContent = p(Math.floor(s / 3600)) + ":" + p(Math.floor(s % 3600 / 60)) + ":" + p(s % 60);
}
setInterval(tickClock, 1000);

$("logStart").addEventListener("click", function () {
  log.running = { t0: Date.now() };
  if (!log.start) log.start = todayStr();
  saveStore(); tickClock(); render();
});
$("logStop").addEventListener("click", function () {
  if (!log.running) return;
  var min = Math.max(1, Math.round((Date.now() - log.running.t0) / 60000));
  log.running = null;
  addEntry(todayStr(), min, $("logNote").value.trim());
  $("logNote").value = "";
  toast(t("toastAdded"));
});
$("logAdd").addEventListener("click", function () {
  var err = $("logErr"), date = $("logDate").value || todayStr(), min = parseNum($("logMin").value);
  err.hidden = true;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayStr()) { err.textContent = t("logErrDate"); err.hidden = false; return; }
  if (isNaN(min) || min <= 0 || min > 60 * 24 * 31) { err.textContent = t("logErrMin"); err.hidden = false; return; }
  addEntry(date, Math.round(min), $("logNote").value.trim());
  $("logMin").value = ""; $("logNote").value = "";
  toast(t("toastAdded"));
});
$("logClear").addEventListener("click", function () {
  if (!confirm(t("logClearAsk"))) return;
  log = { start: null, entries: [], running: null }; saveStore(); render();
});

/* ---------- start ---------- */
buildFields();
applyI18n();
$("logDate").value = todayStr();
$("logDate").max = todayStr();
shownYear = compute(state, log, todayStr()).year;
render();
tickClock();

if ("IntersectionObserver" in window) {
  new IntersectionObserver(function (es) {
    $("bar").classList.toggle("off", es[0].isIntersecting);
  }, { threshold: 0.05 }).observe($("result"));
} else { $("bar").classList.remove("off"); }

/* Keep the result beside the questions on wide screens, without ever hiding its lower part. */
function placeResult() {
  var col = document.querySelector(".result-col");
  col.style.top = Math.min(16, window.innerHeight - col.offsetHeight - 16 - (window.__tourBar || 0)) + "px";
}
if ("ResizeObserver" in window) new ResizeObserver(placeResult).observe($("result"));
window.addEventListener("resize", placeResult);
placeResult();
</script>
<script src="tour.js"></script>
